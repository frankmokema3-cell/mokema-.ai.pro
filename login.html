<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mokema Binary AI Login</title>

<style>

body{

margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#07111f;
font-family:Arial;
color:white;

}


.box{

width:330px;
background:#111827;
padding:25px;
border-radius:20px;
text-align:center;

}


h1{

color:#00ff88;

}


input{

width:90%;
padding:12px;
margin:10px;
border-radius:8px;
border:none;

}


button{

width:95%;
padding:13px;
background:#008cff;
color:white;
border:none;
border-radius:8px;
font-size:16px;

}


button:hover{

background:#006dcc;

}

</style>

</head>


<body>


<div class="box">


<h1>
📊 Mokema Binary AI
</h1>


<p>
Login to continue
</p>


<input id="username" placeholder="Username">


<input id="password" type="password" placeholder="Password">


<button onclick="login()">

Login

</button>


<p id="message"></p>


</div>



<script>

function login(){

let user = document.getElementById("username").value;

let pass = document.getElementById("password").value;


if(user=="admin" && pass=="1234"){


localStorage.setItem("mokemaUser", user);


document.getElementById("message").innerHTML =
"Login successful";


window.location="index.html";


}

else{


document.getElementById("message").innerHTML =
"Wrong login details";


}


}

</script>


</body>

</html>
